<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5865F2"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#23A55A"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B232"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="12" fill="#1E1F22"/>

  <!-- Top Node: Discord User -->
  <rect x="250" y="20" width="300" height="44" rx="22" fill="#2B2D31" stroke="#5865F2" stroke-width="2"/>
  <text x="400" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F2F3F5" text-anchor="middle">Discord Admin / Whitelisted User</text>

  <!-- Line: User -> Bot -->
  <line x1="400" y1="64" x2="400" y2="132" stroke="#5865F2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="255" y="76" width="290" height="24" rx="6" fill="#313338"/>
  <text x="400" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#DBDEE1" text-anchor="middle">/panel command  •  Start / Restart / Stop</text>

  <!-- Subgraph: Harimine Bot Async Engine -->
  <rect x="120" y="114" width="560" height="162" rx="10" fill="#2B2D31" stroke="#4E5058" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="140" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#949BA4" letter-spacing="0.8">HARIMINE BOT ASYNC ENGINE (PYTHON)</text>

  <!-- Core Bot Node -->
  <rect x="280" y="140" width="240" height="44" rx="8" fill="#5865F2"/>
  <text x="400" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Harimine Bot (discord.py)</text>

  <!-- Internal Branches -->
  <path d="M 280 162 L 235 162 L 235 204" fill="none" stroke="#23A55A" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 520 162 L 565 162 L 565 204" fill="none" stroke="#F0B232" stroke-width="2" marker-end="url(#arrow-gold)"/>

  <!-- Left Engine Node: aiohttp -->
  <rect x="140" y="212" width="190" height="50" rx="6" fill="#313338" stroke="#23A55A" stroke-width="1.5"/>
  <text x="235" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F2F3F5" text-anchor="middle">HTTP Client (aiohttp)</text>
  <text x="235" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#B5BAC1" text-anchor="middle">Background Loop (30s)</text>

  <!-- Right Engine Node: mcstatus -->
  <rect x="470" y="212" width="190" height="50" rx="6" fill="#313338" stroke="#F0B232" stroke-width="1.5"/>
  <text x="565" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F2F3F5" text-anchor="middle">MC Query (mcstatus)</text>
  <text x="565" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#B5BAC1" text-anchor="middle">Async Status Ping</text>

  <!-- Connections to External Services -->
  <!-- Left: aiohttp <-> Panel API -->
  <line x1="190" y1="262" x2="150" y2="328" stroke="#23A55A" stroke-width="2" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <rect x="35" y="286" width="230" height="24" rx="6" fill="#313338"/>
  <text x="150" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#DBDEE1" text-anchor="middle">GET /resources • POST /power</text>

  <!-- Center: Bot -> Discord Channel -->
  <line x1="400" y1="184" x2="400" y2="328" stroke="#5865F2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="300" y="286" width="200" height="24" rx="6" fill="#313338"/>
  <text x="400" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#DBDEE1" text-anchor="middle">Smart Delta Cache &amp; Edit</text>

  <!-- Right: mcstatus <-> Minecraft Server -->
  <line x1="610" y1="262" x2="650" y2="328" stroke="#F0B232" stroke-width="2" marker-start="url(#arrow-gold)" marker-end="url(#arrow-gold)"/>
  <rect x="545" y="286" width="210" height="24" rx="6" fill="#313338"/>
  <text x="650" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#DBDEE1" text-anchor="middle">TCP Ping (Port 25565)</text>

  <!-- Bottom Row: External Targets -->
  <!-- 1. Pelican / Pterodactyl API -->
  <rect x="40" y="336" width="220" height="64" rx="8" fill="#2B2D31" stroke="#23A55A" stroke-width="2"/>
  <text x="150" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F2F3F5" text-anchor="middle">Pelican / Pterodactyl API</text>
  <text x="150" y="383" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#949BA4" text-anchor="middle">State, RAM, CPU, Uptime</text>

  <!-- 2. Discord Text Channel -->
  <rect x="290" y="336" width="220" height="64" rx="8" fill="#2B2D31" stroke="#5865F2" stroke-width="2"/>
  <text x="400" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F2F3F5" text-anchor="middle">Discord Text Channel</text>
  <text x="400" y="383" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#949BA4" text-anchor="middle">Live Embed &amp; Power Buttons</text>

  <!-- 3. Minecraft Server -->
  <rect x="540" y="336" width="220" height="64" rx="8" fill="#2B2D31" stroke="#F0B232" stroke-width="2"/>
  <text x="650" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F2F3F5" text-anchor="middle">Minecraft Dedicated Server</text>
  <text x="650" y="383" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#949BA4" text-anchor="middle">Online / Max Players</text>
</svg>
